services:
  site:
    build: .
    restart: unless-stopped
    env_file: .env.local
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_PATH: /app/data/veyl.sqlite
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - veyl-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  veyl-data:
